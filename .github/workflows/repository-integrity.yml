name: Repository integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '14'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integrity-output
          ulimit -v 1048576
          ulimit -f 65536
          timeout --signal=TERM --kill-after=5s 60s python -B .github/scripts/check_repository.py >integrity-output/materials.txt 2>&1
      - name: Upload raw outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-integrity-output
          path: integrity-output/
          if-no-files-found: warn
          retention-days: 14
